<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}KPI Dashboard{% endblock %} – {{ data.team_name }}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">{{ data.team_name }} · KPI Dashboard {{ data.year }}</span>
      </a>
      <nav class="header-nav">
        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Team-Übersicht</a>
        <span class="nav-sep">|</span>
        <a href="/team-kpis" class="nav-link {% if request.path == '/team-kpis' %}active{% endif %}">Team-KPIs</a>
        <span class="nav-sep">|</span>
        <a href="/upload" class="nav-link {% if request.path == '/upload' %}active{% endif %}">Word hochladen</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    Stand: {{ data.generated_at }} &nbsp;·&nbsp; {{ data.members | length }} Teammitglieder
  </footer>

  <script src="/static/dashboard.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
